# ======================================================================
#  Google Flow - AI settings   (edit, save, restart run-web / run-workers)
#  Lines starting with # are ignored. Environment variables override this file.
# ======================================================================

# Which free AI service makes the picture:
#   pollinations  -> NO key needed (default)
#   huggingface   -> needs HF_TOKEN below (free account token)
#   simulated     -> no internet; old pixel animation (for offline demo)
FLOW_PROVIDER=pollinations

# OPTIONAL backup (and main provider if FLOW_PROVIDER=huggingface).
# Get a free token: https://huggingface.co/settings/tokens  (type "Read" / inference permission)
# HF_TOKEN=hf_xxxxxxxxxxxxxxxxxxxxxxxx
# HF_MODEL=black-forest-labs/FLUX.1-schnell

# Pollinations free tier allows about 1 image per ~15 seconds. Jobs wait their turn automatically.
# FLOW_MIN_GAP_MS=15000

# false (default) = if the AI service keeps failing, the job is retried by the backend, then marked Failed and the quota is refunded
# true            = instead make the old simulated animation (labelled OFFLINE DEMO) - use only if you have NO internet in the viva
# FLOW_FALLBACK=false

# Free services sometimes answer 500 / 402 / 429 when busy. Each image request is tried this many times,
# waiting longer each time (wait x attempt number).
# FLOW_API_TRIES=5
# FLOW_RETRY_WAIT_MS=10000

# Set to 0.15 to randomly fail 15% of jobs, to demonstrate retry/failover in the viva
# FLOW_FAIL_PROB=0.0

# ======================================================================
#  IMAGE -> VIDEO  (upload a picture + prompt -> 5-6 s clip)
# ======================================================================
# Engines are tried in this order. "gradio" = FREE public Hugging Face Spaces, "fal" = fal.ai (needs FAL_KEY).
# If every AI engine fails, a local MOTION EFFECT (not AI) is used so you still get a clip (see FLOW_I2V_FALLBACK).
# FLOW_I2V_PROVIDER=gradio,fal
#
# Hugging Face Spaces that take an image + prompt and return a video (tried in order, the first that answers wins).
# Free Spaces can be asleep / queued / out of GPU quota. A free HF_TOKEN (see above) gives a much bigger GPU quota.
# FLOW_I2V_SPACES=https://lightricks-ltx-video-distilled.hf.space,https://zerogpu-aoti-wan2-2-fast.hf.space
# Force one endpoint name of the Space (normally detected automatically from the Space's /info page):
# FLOW_I2V_API_NAME=/generate_video
#
# fal.ai (optional, paid / free signup credits):  https://fal.ai/dashboard/keys
# FAL_KEY=xxxxxxxx:xxxxxxxxxxxxxxxx
# FAL_I2V_MODEL=fal-ai/ltx-video/image-to-video
#
# true (default) = if no AI engine works, make the local motion-effect clip instead (job history says "not AI")
# false          = mark the job Failed (retry + quota refund) instead
# FLOW_I2V_FALLBACK=true
# Total seconds spent on AI engines for one clip before falling back (free GPUs can queue):
# FLOW_I2V_TIMEOUT_S=200

# ======================================================================
#  AI PROMPT ASSISTANT  (simple idea -> cinematic prompt, "Enhance with AI" button / terminal option 11)
# ======================================================================
# Needs NO key by default: tries the free Pollinations text AI, then Hugging Face (if HF_TOKEN is set above),
# and if nothing answers a built-in cinematic template is used (the reply says which engine wrote the prompt).
# FLOW_PROMPT_PROVIDER=custom,pollinations,huggingface
#
# Your own OpenAI-compatible LLM (Groq, OpenRouter, OpenAI, local Ollama ...) - highest priority when set:
# FLOW_LLM_URL=https://api.groq.com/openai/v1/chat/completions
# FLOW_LLM_KEY=your_key
# FLOW_LLM_MODEL=llama-3.1-8b-instant
#
# HF_LLM_MODEL=meta-llama/Llama-3.1-8B-Instruct
# Seconds per provider / for everything before the template is used:
# FLOW_PROMPT_TIMEOUT_S=12
# FLOW_PROMPT_TOTAL_S=20

# ======================================================================
#  SCENE BUILDER / VIDEO TIMELINE  (combine Library clips into one movie)
# ======================================================================
# Works with the plain JDK for GIF clips, pictures and GIF output.
# OPTIONAL: install ffmpeg (https://ffmpeg.org) so that the command "ffmpeg" works in a terminal. Then
#   - MP4/WEBM clips (Image -> Video AI clips) can be used as scenes, and
#   - the "Output: MP4" choice appears (needs the libx264 encoder, which standard ffmpeg builds include).
# If ffmpeg is not on your PATH, give its full path:
# FLOW_FFMPEG=C:/tools/ffmpeg/bin/ffmpeg.exe
